    <!-- Apply saved theme / language before first paint (prevents flashes) -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          // ?lang=ar / ?theme=light in the URL override the saved preference
          var params = new URLSearchParams(location.search);
          var theme = params.get('theme') || localStorage.getItem('theme');
          if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
          var lang = params.get('lang') || localStorage.getItem('lang');
          if (lang === 'ar' || lang === 'en') {
            root.lang = lang;
            root.dir = lang === 'ar' ? 'rtl' : 'ltr';
          }
        } catch (e) {}
      })();
    </script>
